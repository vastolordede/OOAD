spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.minimum-idle=0

# Disallow mock payment confirmation in production even when the default configuration changes.
app.payment.simulation-enabled=false

# Never expose password reset tokens in production API responses.
app.password-reset.expose-token=false
