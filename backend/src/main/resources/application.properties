# Load local development secrets from backend/.env when present.
# .env is ignored by Git; .env.example is committed as the template.
spring.config.import=optional:file:.env[.properties]

spring.application.name=ooad-cosmetics
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ooad_cosmetics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway owns schema changes. Do not use Hibernate auto-create/update.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Prepared now for the authentication phase. No secret is hard-coded here.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
