spring.application.name=ooad-cosmetics
server.port=${SERVER_PORT:8080}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# A customer must never be able to mark a real payment PAID without a trusted gateway callback.
app.payment.simulation-enabled=${PAYMENT_SIMULATION_ENABLED:false}

# Map optional .env values explicitly so VNPay sandbox works with spring.config.import.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}

app.password-reset.expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:30}
app.password-reset.expose-token=${RESET_EXPOSE_TOKEN:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:ooad-cosmetics}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
