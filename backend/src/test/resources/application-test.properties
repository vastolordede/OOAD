# Cấu hình cho integration test. Chỉ chạy trên database RIÊNG, tên có chứa "test".
# Tạo database một lần:  CREATE DATABASE ooad_cosmetics_test;
# Mặc định dùng cùng user/password với DB_USERNAME / DB_PASSWORD trong backend/.env.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ooad_cosmetics_test}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=integration-test-secret-key-with-at-least-32-characters
app.jwt.expiration-ms=3600000

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.ooad=INFO
