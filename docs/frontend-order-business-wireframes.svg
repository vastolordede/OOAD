<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Cart, checkout, order, and dashboard wireframes</title>
  <desc id="description">Low-fidelity desktop wireframes for the customer cart, checkout, customer orders, and admin dashboard.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #253044; }
      .panel { fill: #fff; stroke: #9aa7b8; stroke-width: 2; }
      .surface { fill: #f4f6f9; stroke: #b4bfcc; stroke-width: 1.5; }
      .muted { fill: #657286; font-size: 14px; }
      .label { font-size: 16px; font-weight: 600; }
      .heading { font-size: 24px; font-weight: 700; }
      .title { font-size: 30px; font-weight: 700; }
      .button { fill: #e7edf5; stroke: #73849a; stroke-width: 1.5; }
      .line { stroke: #c3ccd7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#eef1f5"/>
  <text x="48" y="54" class="title">Order &amp; Business — UI Wireframes</text>
  <text x="48" y="82" class="muted">Desktop structure; labels represent backend-backed content rather than sample business data.</text>

  <g transform="translate(48 112)">
    <rect width="648" height="438" rx="10" class="panel"/>
    <text x="24" y="38" class="heading">Cart</text>
    <text x="24" y="64" class="muted">Customer flow · proceed to checkout</text>
    <rect x="24" y="86" width="600" height="40" rx="5" class="surface"/>
    <text x="40" y="112" class="label">Product</text>
    <text x="330" y="112" class="label">Quantity</text>
    <text x="466" y="112" class="label">Price</text>
    <text x="560" y="112" class="label">Action</text>
    <rect x="24" y="138" width="600" height="72" rx="5" class="surface"/>
    <rect x="40" y="152" width="44" height="44" rx="4" fill="#dbe2eb"/>
    <text x="98" y="170" class="label">Product name</text>
    <text x="98" y="192" class="muted">Selected variant</text>
    <rect x="330" y="158" width="90" height="32" rx="4" fill="#fff" stroke="#b4bfcc"/>
    <text x="350" y="180" class="muted">−  qty  +</text>
    <text x="466" y="180" class="label">Line total</text>
    <text x="568" y="180" class="muted">Remove</text>
    <rect x="24" y="222" width="600" height="72" rx="5" class="surface"/>
    <rect x="40" y="236" width="44" height="44" rx="4" fill="#dbe2eb"/>
    <text x="98" y="254" class="label">Product name</text>
    <text x="98" y="276" class="muted">Selected variant</text>
    <rect x="330" y="242" width="90" height="32" rx="4" fill="#fff" stroke="#b4bfcc"/>
    <text x="350" y="264" class="muted">−  qty  +</text>
    <text x="466" y="264" class="label">Line total</text>
    <text x="568" y="264" class="muted">Remove</text>
    <line x1="24" y1="320" x2="624" y2="320" class="line"/>
    <text x="366" y="350" class="label">Subtotal</text>
    <text x="560" y="350" class="muted">Cart total</text>
    <rect x="424" y="372" width="200" height="44" rx="6" class="button"/>
    <text x="463" y="400" class="label">Continue to checkout</text>
  </g>

  <g transform="translate(744 112)">
    <rect width="648" height="438" rx="10" class="panel"/>
    <text x="24" y="38" class="heading">Checkout</text>
    <text x="24" y="64" class="muted">Address and totals are confirmed by backend preview.</text>
    <text x="24" y="104" class="label">1. Shipping address</text>
    <rect x="24" y="118" width="370" height="64" rx="5" class="surface"/>
    <circle cx="46" cy="150" r="8" fill="#fff" stroke="#73849a" stroke-width="2"/>
    <text x="64" y="146" class="label">Saved address</text>
    <text x="64" y="166" class="muted">Recipient · phone · address</text>
    <rect x="24" y="190" width="370" height="42" rx="5" fill="#fff" stroke="#b4bfcc"/>
    <text x="40" y="216" class="muted">Choose another address</text>
    <text x="24" y="264" class="label">2. Voucher</text>
    <rect x="24" y="278" width="240" height="42" rx="5" fill="#fff" stroke="#b4bfcc"/>
    <text x="40" y="304" class="muted">Voucher code</text>
    <rect x="272" y="278" width="122" height="42" rx="5" class="button"/>
    <text x="304" y="304" class="label">Apply</text>
    <rect x="416" y="86" width="208" height="248" rx="6" class="surface"/>
    <text x="434" y="116" class="label">Order summary</text>
    <line x1="434" y1="132" x2="606" y2="132" class="line"/>
    <text x="434" y="160" class="muted">Subtotal</text>
    <text x="552" y="160" class="muted">Amount</text>
    <text x="434" y="190" class="muted">Discount</text>
    <text x="552" y="190" class="muted">Amount</text>
    <text x="434" y="220" class="muted">Shipping</text>
    <text x="552" y="220" class="muted">Amount</text>
    <line x1="434" y1="238" x2="606" y2="238" class="line"/>
    <text x="434" y="266" class="label">Total</text>
    <text x="552" y="266" class="label">Amount</text>
    <rect x="416" y="350" width="208" height="48" rx="6" class="button"/>
    <text x="451" y="380" class="label">Confirm order</text>
    <text x="24" y="380" class="muted">Loading, error, empty cart, and submit states.</text>
  </g>

  <g transform="translate(48 582)">
    <rect width="648" height="438" rx="10" class="panel"/>
    <text x="24" y="38" class="heading">My Orders</text>
    <text x="24" y="64" class="muted">Filter and paginate from the orders API.</text>
    <rect x="24" y="86" width="600" height="40" rx="5" class="surface"/>
    <text x="40" y="112" class="label">Order</text>
    <text x="220" y="112" class="label">Created</text>
    <text x="364" y="112" class="label">Total</text>
    <text x="472" y="112" class="label">Status</text>
    <text x="560" y="112" class="label">Action</text>
    <rect x="24" y="138" width="600" height="64" rx="5" class="surface"/>
    <text x="40" y="176" class="muted">Order number</text>
    <text x="220" y="176" class="muted">Date</text>
    <text x="364" y="176" class="muted">Amount</text>
    <text x="472" y="176" class="muted">Status</text>
    <text x="560" y="176" class="muted">View</text>
    <rect x="24" y="210" width="600" height="64" rx="5" class="surface"/>
    <text x="40" y="248" class="muted">Order number</text>
    <text x="220" y="248" class="muted">Date</text>
    <text x="364" y="248" class="muted">Amount</text>
    <text x="472" y="248" class="muted">Status</text>
    <text x="560" y="248" class="muted">View</text>
    <rect x="24" y="282" width="600" height="64" rx="5" class="surface"/>
    <text x="40" y="320" class="muted">Order number</text>
    <text x="220" y="320" class="muted">Date</text>
    <text x="364" y="320" class="muted">Amount</text>
    <text x="472" y="320" class="muted">Status</text>
    <text x="560" y="320" class="muted">View</text>
    <text x="24" y="386" class="muted">Order detail includes items, totals, address, timeline/status, and eligible cancel/review actions.</text>
    <text x="24" y="410" class="muted">Empty, loading, error, and pagination states.</text>
  </g>

  <g transform="translate(744 582)">
    <rect width="648" height="438" rx="10" class="panel"/>
    <text x="24" y="38" class="heading">Admin Dashboard</text>
    <text x="24" y="64" class="muted">ADMIN-protected; all figures from dashboard endpoints.</text>
    <rect x="24" y="86" width="136" height="86" rx="6" class="surface"/>
    <rect x="174" y="86" width="136" height="86" rx="6" class="surface"/>
    <rect x="324" y="86" width="136" height="86" rx="6" class="surface"/>
    <rect x="474" y="86" width="150" height="86" rx="6" class="surface"/>
    <text x="40" y="116" class="muted">Customers</text>
    <text x="40" y="148" class="label">Summary</text>
    <text x="190" y="116" class="muted">Products</text>
    <text x="190" y="148" class="label">Summary</text>
    <text x="340" y="116" class="muted">Orders</text>
    <text x="340" y="148" class="label">Summary</text>
    <text x="490" y="116" class="muted">Revenue</text>
    <text x="490" y="148" class="label">Summary</text>
    <rect x="24" y="190" width="352" height="190" rx="6" class="surface"/>
    <text x="42" y="220" class="label">Orders by status</text>
    <line x1="52" y1="348" x2="348" y2="348" class="line"/>
    <line x1="52" y1="248" x2="52" y2="348" class="line"/>
    <rect x="84" y="286" width="36" height="62" fill="#c7d2df"/>
    <rect x="144" y="260" width="36" height="88" fill="#b8c7d8"/>
    <rect x="204" y="300" width="36" height="48" fill="#c7d2df"/>
    <rect x="264" y="272" width="36" height="76" fill="#b8c7d8"/>
    <rect x="396" y="190" width="228" height="190" rx="6" class="surface"/>
    <text x="414" y="220" class="label">Low stock</text>
    <line x1="414" y1="238" x2="606" y2="238" class="line"/>
    <text x="414" y="266" class="muted">Variant · remaining quantity</text>
    <line x1="414" y1="282" x2="606" y2="282" class="line"/>
    <text x="414" y="310" class="muted">Variant · remaining quantity</text>
    <line x1="414" y1="326" x2="606" y2="326" class="line"/>
    <text x="24" y="414" class="muted">Responsive behavior: stack panels and summary cards on narrow screens; retain clear labels and actions.</text>
  </g>
</svg>
